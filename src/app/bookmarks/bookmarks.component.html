<ActionBar title="Bookmarks" iosLargeTitle="true"></ActionBar>

<GridLayout>
  @if (people.bookmarks().length === 0) {
    <StackLayout class="empty" verticalAlignment="center">
      <Image src="sys://bookmark.slash" class="empty-symbol"></Image>
      <Label text="No bookmarks yet" class="empty-title"></Label>
      <Label text="Use the bookmark button in a pioneer's toolbar." class="empty-caption" textWrap="true"></Label>
    </StackLayout>
  } @else {
    <ListView [items]="people.bookmarks()" class="list" separatorColor="transparent" (itemTap)="onItemTap($event)" (loaded)="onListLoaded($event)">
      <ng-template let-p="item">
        <ns-pioneer-row [pioneer]="p"></ns-pioneer-row>
      </ng-template>
    </ListView>
  }
</GridLayout>
